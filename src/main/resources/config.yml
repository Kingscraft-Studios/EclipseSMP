# =============================================================
#  Eclipse SMP — main configuration
#  All values below are safe to tune. Use /eclipse reload after
#  editing (op only).
# =============================================================

# Worlds where the eclipse systems (powers, shards, deaths) apply.
enabled-worlds:
  - world
  - world_nether
  - world_the_end

# -------------------------------------------------------------
#  Blood Eclipse events
# -------------------------------------------------------------
eclipse:
  enabled: true

  # Natural eclipses fire every interval ± jitter (real minutes).
  interval-minutes: 180
  interval-jitter-minutes: 120

  # Countdown before the eclipse becomes fully active.
  warning-seconds: 60
  # Warning shown when a player triggers via the Eclipse Totem.
  trigger-warning-seconds: 15

  # How long the Blood Eclipse lasts (30 minutes).
  duration-seconds: 1800

  # Cooldown (minutes) between the end of one eclipse and the next
  # player-triggered one.
  trigger-cooldown-minutes: 60

  # During the eclipse: freeze time at midnight, force a storm and
  # grant everyone Night Vision so they can actually fight.
  freeze-time: true
  storm: true
  night-vision: true

  # Announcement looks.
  title-warning: "&c☀ &fThe Eclipse Approaches &c☾"
  title-active: "&4☀☾ &cBLOOD ECLIPSE &4☽☀"
  title-end: "&a☀ &fThe Eclipse has lifted &a☾"
  bossbar-warning: "&c☀ Blood Eclipse incoming ☾"
  bossbar-active: "&4☀☾ &cBLOOD ECLIPSE ACTIVE &4☽☀"
  bossbar-color: RED
  bossbar-style: SEGMENTED_12

# -------------------------------------------------------------
#  Sol (Day) powers
# -------------------------------------------------------------
sol:
  sunlight:
    damage-multiplier: 1.3
    regeneration-level: 2
    speed-level: 1
    fire-ticks: 60
  darkness:
    damage-multiplier: 0.8
    slowness-level: 1
    weakness-level: 1
  # Sol counterpart to the Luna dash: double-sneak in sunlight for an
  # AoE knockback + ignite burst around you.
  flare:
    enabled: true
    cooldown-seconds: 15
    radius: 4.0
    fire-ticks: 60
    # Instant damage dealt to everyone caught in the blast.
    damage: 3.0
    knockback-power: 1.2
    # Two sneak presses within this window trigger the flare.
    double-tap-window-ms: 400
    # Minimum gap between the two presses (prevents shift-spam misfires).
    micro-cooldown-ms: 200

# -------------------------------------------------------------
#  Luna (Night) powers
# -------------------------------------------------------------
luna:
  darkness:
    damage-multiplier: 1.3
    speed-level: 2
    # Backstab crit on top of the darkness multiplier (1.3 x 1.35 = 1.755).
    crit-multiplier: 1.35
    # Attacking from behind within this many degrees triggers the crit.
    backstab-angle: 60.0
  sunlight:
    # Matches Sol's darkness penalty (damage x0.8 + slowness + weakness):
    # moonlight children take +50% damage in direct daylight.
    incoming-damage-multiplier: 1.5
  dash:
    enabled: true
    cooldown-seconds: 15
    invisibility-seconds: 3
    # Hide the player's armor + held items from other players during the dash
    # (packet-level, via PacketEvents) while keeping the gear fully equipped
    # and functional server-side. Requires the packetevents plugin.
    hide-equipment: true
    # Also hide your own armor + held item from your own client during the dash.
    # With this on you won't see your own weapon/armor for the dash's duration
    # (fully invisible even in third-person); with it off, other players still
    # see you fully invisible, but you keep your own weapon visible.
    hide-equipment-self: false
    power: 1.4
    height: 0.35
    # Two sneak presses within this window trigger the dash.
    double-tap-window-ms: 500
    # Minimum gap between the two presses (prevents shift-spam misfires).
    micro-cooldown-ms: 50

# -------------------------------------------------------------
#  Eclipse combined ultra-state
# -------------------------------------------------------------
eclipse-powers:
  damage-multiplier: 1.5
  speed-level: 2
  regeneration-level: 2
  # Each player gets one random 'surge' when the eclipse starts:
  # 0 = extra damage, 1 = extra speed, 2 = extra regeneration.
  surge-damage-multiplier: 1.25

# -------------------------------------------------------------
#  Eclipse Shards
# -------------------------------------------------------------
shards:
  item-material: AMETHYST_SHARD
  custom-model-data: 14000
  # PvP drop during an eclipse: base + per-victim-gear bonus.
  base-drop: 2
  bonus-per-gear: 1
  max-drop: 6
  # Extra shards when killing the opposite allegiance.
  alignment-bonus: 1

  # New players start with this many shards in their bank.
  starting-bank: 5
  # Percentage of CARRIED shards that drop on the ground on ANY death.
  carried-drop-percent: 100
  # Bank shards lost on a natural death (always dropped as a physical item).
  natural-death-loss: 1
  # Bank shards transferred to the killer on a PvP kill outside an eclipse.
  non-eclipse-pvp-loss: 1
  # When the bank drops to or below this value the player is eliminated.
  eliminate-at: -5

# -------------------------------------------------------------
#  Elimination (death ban & grace)
# -------------------------------------------------------------
elimination:
  enabled: true
  # How long an eliminated player is banned from the server.
  ban-minutes: 1440
  # Bank value restored once the ban expires (the +5 is for new players only).
  reset-to: 0

# -------------------------------------------------------------
#  Eclipse gear
# -------------------------------------------------------------
gear:
  max-tier: 5
  # Craft Eclipse gear from a diamond OR netherite piece. The result keeps the
  # material you put in (diamond in -> diamond Eclipse gear, netherite in ->
  # netherite Eclipse gear). Material is fixed at craft time and never converts.
  netherite:
    enabled: true
  blade:
    bonus-per-tier: 1.0
  axe:
    bonus-per-tier: 1.5
    slowness-ticks: 40
  bow:
    bonus-per-tier: 0.75
    fire-ticks: 60
  # Side-specific Eclipse gear passives (sol vs luna).
  abilities:
    # Fraction of dealt damage healed on a Luna blade hit in darkness.
    luna-lifesteal-percent: 0.35
    sol-blade-multiplier: 1.15
    sol-axe-multiplier: 1.2
    sol-bow-multiplier: 1.15
    luna-bow-multiplier: 1.3
    # Eclipse bow on-hit effects: Sol arrows ignite, Luna arrows slow.
    luna-bow-eclipse-slowness-ticks: 60
    luna-bow-eclipse-slowness-level: 2
  armor:
    # Damage reduction per TOTAL equipped armor tier while in darkness/eclipse.
    # A full tier-5 set (20 tiers) reduces 40% of incoming damage.
    reduction-per-tier: 0.02
    set-bonus:
      regeneration-level: 1
      # Caps how far the full-set regen scales with total tier, so a max set
      # can't stack to Regen V+ during the eclipse (previously ~3.2 HP/s).
      regen-tier-cap: 2
      speed-level: 1
      # Full-set bonuses scale +1 level per 5 total armor tiers.
      sol-strength-level: 1
      luna-strength-level: 1

# -------------------------------------------------------------
#  Alignment switching
# -------------------------------------------------------------
choose:
  # Free switches before it costs Eclipse Shards.
  free-switches: 1
  # Shard bank cost for every switch after the free ones.
  switch-cost: 20

# -------------------------------------------------------------
#  Admin debug commands
#  When enabled (true), unlocks the /eclipse debug subcommands
#  for anyone with the eclipse.smp.admin permission.
# -------------------------------------------------------------
debug:
  enabled: false

# -------------------------------------------------------------
#  Discord webhook (async, non-blocking)
#  role-id: set a Discord role ID to ping it when an eclipse starts.
# -------------------------------------------------------------
discord-webhook:
  enabled: false
  url: ""
  username: "EclipseSMP"
  color: 0xFF5555
  role-id: ""

